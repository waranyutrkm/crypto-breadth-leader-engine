name: Daily Binance Market Snapshot & Dashboard Rebuild

on:
  schedule:
    # Runs every day at 00:15 UTC (07:15 BKK time), right after Binance daily candle close
    - cron: '15 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Live Binance Market Data & Calculate Indicators
        run: |
          python scripts/live_snapshot_engine.py

      - name: Rebuild Standalone Dashboard (index.html)
        run: |
          python scripts/build_standalone_dashboard.py

      - name: Commit and Push Updated Data & Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ index.html
          if git diff-index --quiet HEAD; then
            echo "No changes in data detected. Skipping commit."
          else
            git commit -m "chore(data): automated daily Binance market update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          fi
